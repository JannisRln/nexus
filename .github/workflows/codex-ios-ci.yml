name: Codex iOS CI

on:
  push:
    branches:
      - feat/codex-ios-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Codex device auth and platform compatibility tests
        run: npx jest OpenAICodexDeviceAuth platform-compatibility --runInBand
      - name: All unit tests
        run: npm test -- --runInBand

  build:
    name: Production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck
        run: npm run build
      - name: Upload Obsidian plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-codex-ios-plugin
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
